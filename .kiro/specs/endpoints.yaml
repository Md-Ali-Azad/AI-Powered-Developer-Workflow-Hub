endpoints:
  Project:
    path: /api/projects
    methods: [get, post, put, delete]
  Task:
    path: /api/tasks
    methods: [get, post, patch, delete]
  PullRequest:
    path: /api/prs
    methods: [get, post, patch]
  BuildLog:
    path: /api/builds
    methods: [get, post]
  ChangelogEntry:
    path: /api/changelog
    methods: [get, post]
  Notification:
    path: /api/notifications
    methods: [get, patch]
